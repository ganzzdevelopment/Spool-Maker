name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [materials-download]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install PyQt5 numpy pyscard crc8 ndef nfcpy pyinstaller
      - name: Build (folder, no self-extracting exe)
        run: pyinstaller --onedir --windowed --icon=icon.ico --add-data="icon.ico;." --add-data="gui.ui;." --add-data="materials_fallback.json;." --name SpoolMaker launcher.py
      - name: Hash of the exe
        run: Get-FileHash dist/SpoolMaker/SpoolMaker.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: SpoolMaker-windows-folder
          path: dist/SpoolMaker
