name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install PyQt5 numpy pyscard crc8 ndef nfcpy pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --windowed --icon=icon.ico --add-data="icon.ico;." --add-data="gui.ui;." SpoolMaker.py
      - uses: actions/upload-artifact@v4
        with:
          name: SpoolMaker-windows
          path: dist/SpoolMaker.exe
